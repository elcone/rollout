[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rollout"
version = "0.1.0"
description = "Filesystem SQL model discovery and dependency graphs"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<2",
    "jinja2>=3.1,<4",
    "pydantic>=2,<3",
    "sqlglot>=28,<30",
    "typer>=0.16,<1",
]

[project.scripts]
rollout = "rollout.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 85
