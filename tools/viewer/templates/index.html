<!doctype html>
<html lang="en">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rollout project lineage</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18/dist/index.global.js"></script>
  <style>{{ app_css | safe }}</style>
  </head>
  <body class="fixed inset-0 overflow-hidden bg-slate-50 font-sans text-sm text-slate-700 antialiased">
    <main class="flex h-full w-full overflow-hidden">
      <section id="canvas" aria-label="Lineage graph" class="relative min-h-0 min-w-0 flex-1 bg-slate-50">
        <div id="graph" class="absolute inset-0 cursor-grab touch-none select-none overflow-hidden"></div>
        <div id="message" role="status" class="pointer-events-none absolute left-6 top-6 text-xs text-slate-500">Loading project…</div>
      </section>
      <aside id="panel" aria-label="Project and node details" class="flex h-full w-96 shrink-0 flex-col border-l border-slate-300 bg-slate-100 xl:w-112">
        <div class="shrink-0 border-b border-slate-300 bg-white px-6 pb-4 pt-5">
          <h1 class="mb-4 text-lg font-semibold tracking-tight text-slate-900">Rollout lineage</h1>
        </div>
        <div id="panel-content"  aria-live="polite" class="min-h-0 min-w-0 flex-1 overflow-y-scroll p-6"></div>
      </aside>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@joint/core@4.0.4/dist/joint.min.js"></script>
    <script>{{ app_js | safe }}</script>
  </body>
</html>
